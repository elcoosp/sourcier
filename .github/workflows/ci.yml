name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all features
            args: --all-features
          - name: default features
            args: ""
          - name: no default features
            args: --no-default-features
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy
      # Per-crate invocations so --no-default-features really strips the
      # features: a --workspace run would re-enable sourcier-core defaults
      # through the facade's dependency edge.
      - name: Run clippy
        run: |
          cargo clippy -p sourcier-core --all-targets ${{ matrix.args }} -- -D warnings
          cargo clippy -p sourcier --all-targets ${{ matrix.args }} -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features:
          - { name: "all features", args: "--all-features" }
          - { name: "default", args: "" }
          - { name: "no default", args: "--no-default-features" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run tests (nextest)
        shell: bash
        run: |
          cargo nextest run -p sourcier-core ${{ matrix.features.args }}
          cargo nextest run -p sourcier ${{ matrix.features.args }}
      - name: Run doc tests
        if: matrix.features.args != '--no-default-features'
        run: cargo test --workspace --doc ${{ matrix.features.args }}

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust 1.85 toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.99.1"
      - name: Check with all features
        run: cargo check --workspace --all-features
      - name: Check without default features
        run: |
          cargo check -p sourcier-core --no-default-features --lib --benches
          cargo check -p sourcier --no-default-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  benches:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Build benchmarks
        run: cargo bench --no-run --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Clean first so stale binaries from renamed targets cannot contribute
      # phantom zero-count records to the report.
      - name: Generate coverage report
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
