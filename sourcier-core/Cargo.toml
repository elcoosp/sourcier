[package]
name = "sourcier-core"
description = "Core implementation of compact source file mapping and position tracking"
readme = "README.md"
keywords = ["source-map", "position", "compiler", "diagnostics", "lsp"]
categories = ["development-tools", "parsing", "data-structures"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
rt-feedback = []
serde = ["dep:serde"]
view = []
parallel = ["dep:rayon"]
default = ["serde", "view", "rt-feedback"]

[dependencies]
memchr = { workspace = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = { workspace = true }

[[bench]]
name = "map"
harness = false

[lints]
workspace = true
