[package]
documentation = "https://sourcier.vercel.app"

name = "sourcier-core"
description = "Core implementation of compact source file mapping and position tracking"
readme = "README.md"
keywords = ["parser", "ast", "source", "syntax", "codegen"]
categories = ["development-tools", "parsing", "data-structures"]
version = "2.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/elcoosp/sourcier"
homepage = "https://github.com/elcoosp/sourcier"
authors = ["elcoosp"]

[features]
rt-feedback = []
serde = ["dep:serde"]
view = []
parallel = ["dep:rayon"]
default = ["serde", "view", "rt-feedback"]

[dependencies]
memchr = { workspace = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true, features = ["yaml", "redactions"] }
proptest = { workspace = true }
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = { workspace = true }

[[bench]]
name = "map"
harness = false

[lints]
workspace = true
