[package]
name = "sourcier-core"
description = "Core implementation of compact source file mapping and position tracking"
readme = "README.md"
keywords = ["source-map", "position", "compiler", "diagnostics", "lsp"]
categories = ["development-tools", "parsing", "data-structures"]
version = "2.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/elcoosp/sourcier"
homepage = "https://github.com/elcoosp/sourcier"
authors = ["elcoosp"]

[features]
rt-feedback = []
serde = ["dep:serde"]
view = []
parallel = ["dep:rayon"]
default = ["serde", "view", "rt-feedback"]

[dependencies]
memchr = "2.7"
rayon = { version = "1.10", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = "2.0"

[dev-dependencies]
insta = { version = "1.43", features = ["yaml", "redactions"] }
proptest = "1.9"
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1.0"

[[bench]]
name = "map"
harness = false

[lints]
workspace = true