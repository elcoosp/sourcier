[package]
name = "sourcier"
description = "Compact and efficient source file mapping and position tracking"
readme = "../README.md"
keywords = ["source-map", "position", "compiler", "diagnostics", "lsp"]
categories = ["development-tools", "parsing", "data-structures"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["view"]
view = []
rt-feedback = []
parallel = ["sourcier-core/parallel"]

[dependencies]
sourcier-core = { path = "../sourcier-core", version = "2.0.0" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
