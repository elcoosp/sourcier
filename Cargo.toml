[workspace]
members = ["sourcier-core"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/elcoosp/sourcier"
homepage = "https://github.com/elcoosp/sourcier"
authors = ["elcoosp"]

[workspace.dependencies]
memchr = "2.7"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
insta = { version = "1.43", features = ["yaml", "redactions"] }
proptest = "1.9"
serde_json = "1.0"

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[package]
name = "sourcier"
description = "Compact and efficient source file mapping and position tracking"
readme = "README.md"
keywords = [lib]
path = "src/lib.rs"

[lib]
path = "src/lib.rs"

["source-map", "position", "compiler", "diagnostics", "lsp"]
categories = ["development-tools", "parsing", "data-structures"]
version = "2.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/elcoosp/sourcier"
homepage = "https://github.com/elcoosp/sourcier"
authors = ["elcoosp"]

[features]
default = ["serde", "view", "rt-feedback"]
serde = ["sourcier-core/serde"]
view = ["sourcier-core/view"]
rt-feedback = ["sourcier-core/rt-feedback"]
parallel = ["sourcier-core/parallel"]

[dependencies]
sourcier-core = { path = "sourcier-core", version = "2.0.0" }

[lints]
workspace = false