[workspace]
members = [
    "sourcier-core",
    "sourcier-facade",
]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/elcoosp/sourcier"
homepage = "https://github.com/elcoosp/sourcier"
authors = ["elcoosp"]

[workspace.dependencies]
memchr = "2.7"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
insta = { version = "1.43", features = ["yaml", "redactions"] }
proptest = "1.9"
serde_json = "1.0"

[workspace.lints.rust]
missing_docs = "allow"

[workspace.lints.clippy]
all = "allow"
pedantic = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
